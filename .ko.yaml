apiVersion: ko.build/v1alpha1
kind: Ko

builds:
  - id: firewall
    dir: ./cmd/firewall
    main: .
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.ldVersion={{.Git.Tag}}
      - -X main.ldCommit={{.Git.ShortCommit}}
      - -X main.ldBuildTime={{.Git.CommitDate}}

images:
  - image: dependency-firewall
    build: firewall
    tags:
      - latest
