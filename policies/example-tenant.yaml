tenant_id: "tenant-abc-123"
policies:
  # The evaluator is deny-wins: an allowlist match records a positive reason,
  # but it never overrides a matching deny policy.
  - name: block-critical-vulnerabilities
    type: cvss_threshold
    schema_version: 1
    action: deny
    config:
      max_cvss: 7.0
      minimum_severity: "high"
    enabled: true

  - name: block-new-packages
    type: minimum_age
    schema_version: 1
    action: deny
    config:
      min_age_days: 30
    enabled: true

  - name: block-latest-tag
    type: block_mutable_tag
    schema_version: 1
    action: deny
    config:
      tags:
        - latest
    enabled: true

  - name: allow-internal-images
    type: allowlist
    schema_version: 1
    action: allow
    config:
      namespaces:
        - "internal"
        - "company-registry"
    enabled: true

  - name: block-untrusted-registries
    type: blocklist
    schema_version: 1
    action: deny
    config:
      namespaces:
        - "untrusted-registry"
    enabled: true
