services:
  control-plane:
    image: dependency-firewall:latest
    command: ["-mode=control-plane"]
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      FIREWALL_DATABASE_DSN: "postgres://firewall:firewall@postgres:5432/firewall?sslmode=disable"
      FIREWALL_VALKEY_ADDR: "valkey:6379"
      FIREWALL_LOG_LEVEL: "debug"
      FIREWALL_TELEMETRY_ENABLED: "${FIREWALL_TELEMETRY_ENABLED:-true}"
      FIREWALL_TELEMETRY_ENDPOINT: "${FIREWALL_TELEMETRY_ENDPOINT:-http://otel-collector:4317}"
      FIREWALL_TELEMETRY_PROTOCOL: "${FIREWALL_TELEMETRY_PROTOCOL:-grpc}"
      FIREWALL_TELEMETRY_INSECURE: "${FIREWALL_TELEMETRY_INSECURE:-true}"
      FIREWALL_TELEMETRY_SQL_TRACING_DISABLE_SQL_STATEMENT_IN_ATTRIBUTES: false
      FIREWALL_RUNTIME_MODE: "control-plane"
      FIREWALL_SERVER_PORT: "8080"
      FIREWALL_HEALTH_PROXY_URL: "http://proxy:8080/healthz"
      FIREWALL_BUNDLE_LISTEN_ADDR: ":9090"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  proxy:
    image: dependency-firewall:latest
    command: ["-mode=proxy"]
    ports:
      - "8081:8080"
    environment:
      FIREWALL_VALKEY_ADDR: "valkey:6379"
      FIREWALL_LOG_LEVEL: "debug"
      FIREWALL_TELEMETRY_ENABLED: "${FIREWALL_TELEMETRY_ENABLED:-true}"
      FIREWALL_TELEMETRY_ENDPOINT: "${FIREWALL_TELEMETRY_ENDPOINT:-http://otel-collector:4317}"
      FIREWALL_TELEMETRY_PROTOCOL: "${FIREWALL_TELEMETRY_PROTOCOL:-grpc}"
      FIREWALL_TELEMETRY_INSECURE: "${FIREWALL_TELEMETRY_INSECURE:-true}"
      FIREWALL_RUNTIME_MODE: "proxy"
      FIREWALL_SERVER_PORT: "8080"
      FIREWALL_BUNDLE_CONTROL_PLANE_ADDR: "control-plane:9090"
      FIREWALL_OCI_CACHE_ENABLED: "true"
    depends_on:
      control-plane:
        condition: service_started
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: firewall
      POSTGRES_PASSWORD: firewall
      POSTGRES_DB: firewall
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firewall"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./examples/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      aspire-dashboard:
        condition: service_started
    restart: unless-stopped

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    profiles: ["observability"]
    ports:
      - "18888:18888"
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"

volumes:
  postgres_data:
  valkey_data:
