runtime:
  mode: control-plane

server:
  port: 8080
  read_timeout: 30s
  write_timeout: 0s
  idle_timeout: 120s

database:
  dsn: "postgres://firewall:firewall@postgres:5432/firewall?sslmode=disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

valkey:
  addr: "valkey:6379"
  password: ""
  db: 0

log:
  level: debug
  format: json

telemetry:
  enabled: false
  endpoint: "http://otel-collector:4317"
  protocol: grpc
  insecure: true

audit:
  enabled: true
  slog: true
  postgres: true
  failure_mode: fail_closed
  detail_level: summary

health:
  proxy_url: "http://proxy:8080/healthz"

secrets:
  # Test-only key: base64("0123456789abcdef0123456789abcdef").
  upstream_auth_key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="

bundle:
  listen_addr: ":9090"
  refresh_interval: 30s
  tls:
    mode: mtls
    ca_file: "/etc/firewall/mtls/ca.pem"
    cert_file: "/etc/firewall/mtls/control-plane.pem"
    key_file: "/etc/firewall/mtls/control-plane-key.pem"
    authorized_clients:
      - identity: "proxy-a.firewall.local"
        tenant_ids:
          # Local example only because the seed script creates a fresh tenant ID.
          # Production should list explicit tenant IDs for each proxy identity.
          # - "*"
          - 84734108-d228-4998-bf29-526bea5f8864
          - 5f92b976-f23b-4501-8e8f-e1de7edb6a1e
